{% extends "base.html" %}
{% block title %}일정 관리 · 연구자 포털{% endblock %}
{% block head %}
<style>
/* ===== TSL Portal Calendar — Dark / iOS-style ===== */
.ncal-app {
  display: flex;
  height: calc(100vh - var(--nav-h));
  overflow: hidden;
  background: var(--bg);
  font-family: var(--font-body);
}

/* Sidebar */
.ncal-sidebar {
  width: 252px; min-width: 252px;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
  background: var(--surface);
}

/* Mini Calendar */
.mini-cal-wrap { padding: 14px 10px 6px; }
.mini-cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.mini-cal-month { font-size: .8rem; font-weight: 700; color: var(--fg-2); }
.mini-cal-nav {
  background: none; border: none; cursor: pointer;
  color: var(--fg-4); padding: 2px 6px; border-radius: 5px; font-size: .85rem; line-height: 1;
}
.mini-cal-nav:hover { background: rgba(255,255,255,0.06); color: var(--fg-1); }
.mini-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.mini-cal-dow { font-size: .6rem; color: var(--fg-4); text-align: center; padding: 2px 0 4px; font-weight: 700; }
.mini-cal-day {
  font-size: .72rem; text-align: center; cursor: pointer;
  color: var(--fg-2); border-radius: 50%; aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center; position: relative;
}
.mini-cal-day:hover { background: rgba(255,255,255,0.07); }
.mini-cal-day.mcd-today { background: #ef4444; color: #fff !important; font-weight: 700; }
.mini-cal-day.mcd-selected:not(.mcd-today) { background: rgba(124,111,224,0.25); color: var(--violet-soft); font-weight: 600; }
.mini-cal-day.mcd-other { color: var(--fg-4); }
.mini-cal-day.mcd-has-task::after {
  content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
  width: 4px; height: 4px; border-radius: 50%; background: var(--violet);
}
.mini-cal-day.mcd-today.mcd-has-task::after { background: rgba(255,255,255,0.7); }

.sidebar-divider { height: 1px; background: var(--border); margin: 4px 0; }

.sidebar-nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px; font-size: .8rem; color: var(--fg-3);
  cursor: pointer; border-radius: 6px; margin: 1px 6px;
}
.sidebar-nav-item:hover { background: rgba(255,255,255,0.05); }
.sidebar-nav-item.active { background: rgba(124,111,224,0.16); color: var(--violet-soft); font-weight: 600; }
.sidebar-nav-badge {
  margin-left: auto; background: rgba(255,255,255,0.08);
  color: var(--fg-4); font-size: .68rem; padding: 1px 7px; border-radius: 100px; font-weight: 700;
}
.sidebar-nav-item.active .sidebar-nav-badge { background: rgba(124,111,224,0.3); color: var(--violet-soft); }

.sidebar-section-label {
  font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  color: var(--fg-4); padding: 8px 14px 2px;
}
.proj-label-item {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 14px; font-size: .78rem; color: var(--fg-3); cursor: pointer;
}
.proj-label-item:hover { background: rgba(255,255,255,0.05); border-radius: 6px; margin: 0 2px; padding: 4px 12px; }
.proj-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

.sidebar-tasks { flex: 1; overflow-y: auto; padding: 4px 0 12px; }
.sidebar-group { margin-bottom: 2px; }
.sidebar-group-hdr {
  display: flex; align-items: center; gap: 6px; padding: 6px 14px;
  font-size: .72rem; font-weight: 700; color: var(--fg-4); cursor: pointer; user-select: none;
}
.sidebar-group-hdr:hover { color: var(--fg-3); }
.sidebar-group-arrow { font-size: .6rem; transition: transform .15s; }
.sidebar-group-hdr.collapsed .sidebar-group-arrow { transform: rotate(-90deg); }
.sidebar-task-row {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 5px 14px; cursor: pointer; border-radius: 6px; margin: 0 4px;
}
.sidebar-task-row:hover { background: rgba(255,255,255,0.04); }
.stt-dot { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--border); margin-top: 3px; flex-shrink: 0; }
.stt-dot.doing { border-color: #f59e0b; background: rgba(245,158,11,0.2); }
.stt-dot.done  { border-color: #34d399; background: #34d399; }
.stt-info { flex: 1; min-width: 0; }
.stt-title { font-size: .76rem; color: var(--fg-2); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stt-meta { font-size: .66rem; color: var(--fg-4); margin-top: 1px; }
.stt-meta.overdue { color: #f87171; font-weight: 600; }

/* Main area */
.ncal-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

.ncal-header {
  height: 52px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; gap: 8px; flex-shrink: 0; background: var(--surface);
}
.ncal-header-left { display: flex; align-items: center; gap: 8px; }
.ncal-ttl { font-size: 1rem; font-weight: 700; color: var(--fg-1); letter-spacing: -0.02em; }
.ncal-beta {
  font-size: .62rem; background: rgba(124,111,224,0.2); color: var(--violet-soft);
  padding: 2px 7px; border-radius: 5px; font-weight: 700;
}
.ncal-icon-btn {
  width: 28px; height: 28px; border-radius: 7px;
  border: 1px solid var(--border); background: transparent; cursor: pointer;
  font-size: .9rem; color: var(--fg-3); display: flex; align-items: center; justify-content: center;
}
.ncal-icon-btn:hover { background: rgba(255,255,255,0.06); border-color: var(--line-strong); }
.ncal-header-right { display: flex; align-items: center; gap: 6px; }
.ncal-range-lbl { font-size: .88rem; font-weight: 600; color: var(--fg-2); min-width: 170px; letter-spacing: -0.01em; }
.ncal-today-btn {
  padding: 4px 14px; font-size: .78rem; background: transparent;
  border: 1px solid var(--border); border-radius: 7px; cursor: pointer;
  color: var(--fg-2); font-weight: 600; font-family: var(--font-body);
}
.ncal-today-btn:hover { background: rgba(255,255,255,0.06); }
.ncal-nav-btn {
  width: 28px; height: 28px; border: 1px solid var(--border);
  border-radius: 7px; background: transparent; cursor: pointer;
  color: var(--fg-3); font-size: 1rem; display: flex; align-items: center; justify-content: center;
}
.ncal-nav-btn:hover { background: rgba(255,255,255,0.06); }
.view-tabs { display: flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; margin-left: 4px; }
.view-tab {
  padding: 5px 14px; font-size: .76rem; background: transparent;
  border: none; border-right: 1px solid var(--border); cursor: pointer;
  color: var(--fg-3); font-family: var(--font-body); font-weight: 500;
}
.view-tab:last-child { border-right: none; }
.view-tab.active { background: rgba(124,111,224,0.18); color: var(--violet-soft); font-weight: 700; }

.ncal-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

/* Week view */
.cal-week-container { display: flex; flex-direction: column; height: 100%; }
.cal-week-day-header {
  display: grid; border-bottom: 1px solid var(--border);
  flex-shrink: 0; background: var(--surface);
}
.cal-gutter {}
.cal-day-hdr-cell { padding: 8px 6px; text-align: center; border-left: 1px solid var(--border); }
.cal-day-name { font-size: .65rem; color: var(--fg-4); text-transform: uppercase; font-weight: 700; letter-spacing: .04em; }
.cal-day-num {
  font-size: 1.5rem; font-weight: 300; color: var(--fg-2); line-height: 1;
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; margin: 2px auto 0;
}
.cal-day-num.is-today { background: #ef4444; color: #fff; font-weight: 700; font-size: 1.2rem; }

.cal-allday-row {
  display: grid; border-bottom: 2px solid var(--border);
  flex-shrink: 0; min-height: 32px; background: var(--surface);
}
.cal-allday-gutter { font-size: .6rem; color: var(--fg-4); text-align: right; padding: 6px 5px 0; font-weight: 600; }
.cal-allday-cell { border-left: 1px solid var(--border); padding: 3px; min-height: 32px; cursor: pointer; position: relative; }
.cal-allday-cell:hover { background: rgba(255,255,255,0.03); }

.ev-chip {
  border-radius: 5px; padding: 2px 7px; font-size: .7rem; font-weight: 600; line-height: 1.4;
  cursor: pointer; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border-left: 3px solid transparent; transition: opacity .15s, box-shadow .15s;
}
.ev-chip:hover { opacity: .85; box-shadow: 0 1px 6px rgba(0,0,0,0.3); }
.ev-chip.pri-high   { background: rgba(239,68,68,0.2);  color: #fca5a5; border-color: #ef4444; }
.ev-chip.pri-normal { background: rgba(124,111,224,0.2); color: var(--violet-soft); border-color: var(--violet); }
.ev-chip.pri-low    { background: rgba(52,211,153,0.15); color: #6ee7b7; border-color: #34d399; }
.ev-chip.st-done    { background: rgba(255,255,255,0.05); color: var(--fg-4); border-color: var(--border); text-decoration: line-through; }

.cal-time-scroll { flex: 1; overflow-y: auto; position: relative; }
.cal-time-grid { display: grid; }
.cal-time-row { display: contents; }
.cal-time-label {
  font-size: .62rem; color: var(--fg-4); text-align: right; padding: 0 5px 0 0;
  height: 44px; display: flex; align-items: flex-start; padding-top: 3px;
  box-sizing: border-box; font-weight: 600;
}
.cal-time-cell {
  border-left: 1px solid var(--border); border-top: 1px solid rgba(255,255,255,0.04);
  height: 44px; cursor: pointer; position: relative;
}
.cal-time-cell:hover { background: rgba(124,111,224,0.06); }
.cal-time-row:first-child .cal-time-cell { border-top-color: transparent; }

.now-line { position: absolute; left: 0; right: 0; height: 2px; background: #ef4444; z-index: 10; pointer-events: none; }
.now-dot { position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }

/* Month view */
.cal-month-container { display: flex; flex-direction: column; height: 100%; }
.cal-month-dow-row {
  display: grid; grid-template-columns: repeat(7, 1fr);
  border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--surface);
}
.cal-month-dow { font-size: .65rem; color: var(--fg-4); text-align: center; padding: 8px 0; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.cal-month-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); overflow-y: auto; align-content: start; }
.cal-month-cell {
  border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
  padding: 4px; min-height: 90px; cursor: pointer; position: relative;
}
.cal-month-cell:nth-child(7n) { border-right: none; }
.cal-month-cell.other-m { background: rgba(255,255,255,0.01); }
.cal-month-cell:hover { background: rgba(124,111,224,0.05); }
.cal-month-day-num {
  font-size: .76rem; font-weight: 500; color: var(--fg-2);
  width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; margin-bottom: 2px;
}
.cal-month-cell.other-m .cal-month-day-num { color: var(--fg-4); }
.cal-month-cell.is-today .cal-month-day-num { background: #ef4444; color: #fff; font-weight: 700; }
.cal-month-more { font-size: .65rem; color: var(--fg-4); padding: 1px 3px; cursor: pointer; }
.cal-month-more:hover { color: var(--violet-soft); }

/* Day view */
.cal-day-container { display: flex; flex-direction: column; height: 100%; }
.cal-day-hdr-single { padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--surface); }
.cal-day-hdr-single .cal-day-name { font-size: .8rem; }
.cal-day-hdr-single .cal-day-num { font-size: 2.5rem; font-weight: 200; color: var(--fg-1); margin: 0; width: auto; height: auto; border-radius: 0; }
.cal-day-hdr-single .cal-day-num.is-today { background: none; color: #ef4444; font-weight: 700; }

/* Task popup */
.task-popup {
  display: none; position: fixed;
  background: var(--surface2); border: 1px solid var(--line-strong);
  border-radius: 14px; box-shadow: 0 12px 48px rgba(0,0,0,0.5);
  padding: 16px; width: 288px; z-index: 400;
}
.task-popup.open { display: block; }
.tp-close { position: absolute; top: 10px; right: 12px; background: none; border: none; cursor: pointer; color: var(--fg-4); font-size: 1rem; line-height: 1; }
.tp-close:hover { color: var(--fg-1); }
.tp-title { font-size: .9rem; font-weight: 700; color: var(--fg-1); margin-bottom: 10px; padding-right: 20px; line-height: 1.35; }
.tp-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: .76rem; color: var(--fg-3); }
.tp-icon { width: 16px; text-align: center; flex-shrink: 0; }
.tp-actions { display: flex; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
.tp-btn {
  flex: 1; padding: 6px 8px; border-radius: 7px; font-size: .72rem; cursor: pointer;
  border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--fg-2);
  text-align: center; font-family: var(--font-body); font-weight: 600;
}
.tp-btn:hover { background: rgba(255,255,255,0.08); }
.tp-btn.primary { background: var(--violet); color: #fff; border-color: var(--violet); }
.tp-btn.primary:hover { background: var(--violet-soft); }
.tp-btn.danger { color: #f87171; border-color: rgba(248,113,113,0.3); }
.tp-btn.danger:hover { background: rgba(248,113,113,0.1); }

/* Modal */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); backdrop-filter:blur(8px); z-index:300; align-items:center; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal-box {
  background: var(--surface2); border: 1px solid var(--line-strong);
  border-radius: 16px; padding: 28px; width: 100%; max-width: 520px; margin: 20px;
  max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 80px rgba(0,0,0,0.6);
}
.modal-box h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 20px; color: var(--fg-1); letter-spacing: -0.02em; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: .75rem; font-weight: 600; color: var(--fg-3); margin-bottom: 5px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px;
  font-size: .83rem; font-family: var(--font-body); color: var(--fg-2);
  background: rgba(255,255,255,0.05); box-sizing: border-box; outline: none;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--violet); background: rgba(124,111,224,0.08);
  box-shadow: 0 0 0 3px rgba(124,111,224,0.18);
}
.form-group input::placeholder, .form-group textarea::placeholder { color: var(--fg-4); }
.form-group textarea { min-height: 70px; resize: vertical; }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.btn-modal-cancel {
  padding: 8px 18px; border: 1px solid var(--border); border-radius: 9px;
  background: transparent; color: var(--fg-2); cursor: pointer;
  font-family: var(--font-body); font-size: .82rem; font-weight: 600;
}
.btn-modal-cancel:hover { background: rgba(255,255,255,0.06); }
.btn-modal-save {
  padding: 8px 22px; border: none; border-radius: 9px;
  background: var(--violet); color: #fff; cursor: pointer;
  font-family: var(--font-body); font-size: .82rem; font-weight: 700;
}
.btn-modal-save:hover { background: var(--violet-soft); }
.btn-modal-delete {
  padding: 6px 14px; border: 1px solid rgba(248,113,113,0.3); border-radius: 9px;
  background: transparent; color: #f87171; cursor: pointer;
  font-family: var(--font-body); font-size: .8rem; font-weight: 600;
}
.btn-modal-delete:hover { background: rgba(248,113,113,0.1); }

.status-pill { display: inline-flex; align-items: center; gap: 4px; font-size: .68rem; font-weight: 700; padding: 2px 9px; border-radius: 100px; }
.sp-todo  { background: rgba(255,255,255,0.07); color: var(--fg-4); }
.sp-doing { background: rgba(245,158,11,0.18);  color: #fbbf24; }
.sp-done  { background: rgba(52,211,153,0.15);  color: #34d399; }

@media (max-width: 900px) { .ncal-sidebar { display: none; } }
@media (max-width: 600px) {
  .cal-week-day-header, .cal-allday-row, .cal-time-grid { /* handled by JS */ }
}
</style>
{% endblock %}

{% block content %}
<div class="ncal-app">

  <!-- ════ SIDEBAR ════ -->
  <aside class="ncal-sidebar">
    <!-- Mini Calendar -->
    <div class="mini-cal-wrap">
      <div class="mini-cal-header">
        <span class="mini-cal-month" id="mini-cal-label"></span>
        <div style="display:flex;gap:2px;">
          <button class="mini-cal-nav" onclick="miniCalNav(-1)">‹</button>
          <button class="mini-cal-nav" onclick="miniCalNav(1)">›</button>
        </div>
      </div>
      <div class="mini-cal-grid" id="mini-cal-grid"></div>
    </div>

    <div class="sidebar-divider"></div>

    <!-- Quick nav -->
    <div style="padding:4px 0;">
      <div class="sidebar-nav-item active" id="sn-inbox" onclick="sidebarNav('inbox')">
        <span>📥</span> 전체 태스크
        <span class="sidebar-nav-badge" id="sn-inbox-cnt">0</span>
      </div>
      <div class="sidebar-nav-item" id="sn-overdue" onclick="sidebarNav('overdue')">
        <span>⏰</span> 기한 초과
        <span class="sidebar-nav-badge" id="sn-overdue-cnt">0</span>
      </div>
    </div>

    <div class="sidebar-divider"></div>

    <!-- Projects -->
    <div class="sidebar-section-label">프로젝트</div>
    <div id="proj-labels" style="padding: 0 0 4px;"></div>

    <div class="sidebar-divider"></div>

    <!-- Task list -->
    <div class="sidebar-tasks" id="sidebar-tasks"></div>
  </aside>

  <!-- ════ MAIN ════ -->
  <main class="ncal-main">
    <!-- Header -->
    <div class="ncal-header">
      <div class="ncal-header-left">
        <span class="ncal-ttl">일정 관리</span>
        <span class="ncal-beta">Beta</span>
        <button class="ncal-icon-btn" onclick="openNew()" title="태스크 추가">+</button>
        <button class="ncal-icon-btn" title="필터 / 설정">⚙</button>
      </div>
      <div class="ncal-header-right">
        <span class="ncal-range-lbl" id="range-label"></span>
        <button class="ncal-today-btn" onclick="goToToday()">Today</button>
        <button class="ncal-nav-btn" onclick="navigate(-1)">‹</button>
        <button class="ncal-nav-btn" onclick="navigate(1)">›</button>
        <div class="view-tabs">
          <button class="view-tab active" data-view="week" onclick="setView('week', this)">Week</button>
          <button class="view-tab" data-view="month" onclick="setView('month', this)">Month</button>
          <button class="view-tab" data-view="day" onclick="setView('day', this)">Day</button>
        </div>
      </div>
    </div>

    <!-- Calendar body -->
    <div class="ncal-body" id="ncal-body"></div>
  </main>
</div>

<!-- Task popup -->
<div class="task-popup" id="task-popup">
  <button class="tp-close" onclick="closePopup()">✕</button>
  <div class="tp-title" id="tp-title"></div>
  <div id="tp-rows"></div>
  <div class="tp-actions" id="tp-actions"></div>
</div>

<!-- ── New task modal ── -->
<div class="modal-overlay" id="new-modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal-box">
    <h3>새 태스크</h3>
    <form action="{{ url_for('portal_task_new') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>제목 *</label>
        <input type="text" name="title" id="new-title" placeholder="태스크 제목…" required>
      </div>
      <div class="form-group">
        <label>프로젝트</label>
        <select name="project_id" style="width:100%">
          <option value="">없음</option>
          {% for p in projects %}
          <option value="{{ p.id }}">{{ p.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-grid-2">
        <div class="form-group">
          <label>담당자</label>
          <select name="assigned_to" style="width:100%">
            <option value="">없음</option>
            {% for m in members %}
            <option value="{{ m }}">{{ m }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>마감일</label>
          <input type="date" name="due_date" id="new-due-date">
        </div>
      </div>
      <div class="form-grid-2">
        <div class="form-group">
          <label>우선순위</label>
          <select name="priority">
            <option value="normal">🟡 보통</option>
            <option value="high">🔴 긴급</option>
            <option value="low">🟢 낮음</option>
          </select>
        </div>
        <div class="form-group">
          <label>상태</label>
          <select name="status" id="new-status-sel">
            <option value="todo">할 일</option>

<script>
// ── Data ──
var TASKS    = {{ tasks | tojson }};
var PROJECTS = {{ projects | tojson }};
var NOW_DATE = "{{ now_date }}";
var PROJ_COLORS = ['#3b82f6','#8b5cf6','#10b981','#f59e0b','#ec4899','#06b6d4','#ef4444','#84cc16','#f97316','#14b8a6'];
var projColorMap = {};
PROJECTS.forEach(function(p, i){ projColorMap[p.id] = PROJ_COLORS[i % PROJ_COLORS.length]; });

// ── State ──
var currentView = 'week';
var pivotDate   = new Date(); // anchor date for current view
var miniCalDate = new Date(); // month shown in mini calendar

// ── Helpers ──
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var MONTHS_KR = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
var DAYS_KR  = ['일','월','화','수','목','금','토'];
var DAYS_EN  = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

function dateStr(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function parseDate(s) {
  if (!s) return null;
  var p = s.split('-');
  return new Date(+p[0], +p[1]-1, +p[2]);
}
function addDays(d, n) {
  var r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function isSameDay(a, b) {
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function startOfWeek(d) { // Monday start
  var r = new Date(d);
  var dow = r.getDay();
  var diff = (dow === 0) ? -6 : 1 - dow;
  r.setDate(r.getDate() + diff);
  return r;
}
function tasksForDate(dateObj) {
  var ds = dateStr(dateObj);
  return TASKS.filter(function(t){ return t.due_date === ds; });
}
function tasksDueInRange(start, end) {
  return TASKS.filter(function(t){
    if (!t.due_date) return false;
    return t.due_date >= dateStr(start) && t.due_date <= dateStr(end);
  });
}
function chipClass(t) {
  if (t.status === 'done') return 'st-done';
  if (t.priority === 'high') return 'pri-high';
  if (t.priority === 'low') return 'pri-low';
  return 'pri-normal';
}

// ── Sidebar setup ──
function buildProjLabels() {
  var el = document.getElementById('proj-labels');
  if (!PROJECTS.length) { el.innerHTML = '<div style="padding:4px 14px;font-size:.75rem;color:#9ca3af;">프로젝트 없음</div>'; return; }
  el.innerHTML = PROJECTS.map(function(p, i){
    var c = PROJ_COLORS[i % PROJ_COLORS.length];
    return '<div class="proj-label-item"><div class="proj-dot" style="background:'+c+'"></div>'+p.name+'</div>';
  }).join('');
}

function buildSidebarTasks() {
  var groups = [
    { id: 'todo',  label: '할 일',   cls: '', count: 0 },
    { id: 'doing', label: '진행 중', cls: 'doing', count: 0 },
    { id: 'done',  label: '완료',    cls: 'done',  count: 0 },
  ];
  var map = { todo:[], doing:[], done:[] };
  TASKS.forEach(function(t){ if (map[t.status]) map[t.status].push(t); });

  var html = '';
  groups.forEach(function(g){
    var items = map[g.id];
    html += '<div class="sidebar-group">';
    html += '<div class="sidebar-group-hdr" onclick="toggleGroup(this)">';
    html += '<span class="sidebar-group-arrow">▾</span>';
    html += '<span>'+g.label+'</span>';
    html += '<span style="margin-left:auto;font-size:.68rem;font-weight:600;color:#9ca3af">'+items.length+'</span>';
    html += '</div><div class="sidebar-group-body">';
    items.forEach(function(t){
      var overdue = t.due_date && t.due_date < NOW_DATE && t.status !== 'done';
      html += '<div class="sidebar-task-row" onclick="openEdit('+JSON.stringify(t).replace(/"/g,'&quot;')+')">';
      html += '<div class="stt-dot '+g.cls+'"></div>';
      html += '<div class="stt-info">';
      html += '<div class="stt-title">'+escHtml(t.title)+'</div>';
      var meta = '';
      if (t.due_date) meta = t.due_date;
      if (t.project_name) meta += (meta?' · ':'')+t.project_name;
      html += '<div class="stt-meta'+(overdue?' overdue':'')+'">'+escHtml(meta)+'</div>';
      html += '</div></div>';
    });
    html += '</div></div>';
  });
  document.getElementById('sidebar-tasks').innerHTML = html;

  // badges
  document.getElementById('sn-inbox-cnt').textContent = TASKS.length;
  var overdueCnt = TASKS.filter(function(t){ return t.due_date && t.due_date < NOW_DATE && t.status !== 'done'; }).length;
  document.getElementById('sn-overdue-cnt').textContent = overdueCnt;
}

function toggleGroup(hdr) {
  hdr.classList.toggle('collapsed');
  var body = hdr.nextElementSibling;
  body.style.display = hdr.classList.contains('collapsed') ? 'none' : '';
}
function sidebarNav(type) {
  document.querySelectorAll('.sidebar-nav-item').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById('sn-'+type).classList.add('active');
}

// ── Mini Calendar ──
function renderMiniCal() {
  var y = miniCalDate.getFullYear();
  var m = miniCalDate.getMonth();
  document.getElementById('mini-cal-label').textContent = y+'년 '+MONTHS_KR[m];

  var today = new Date();
  var firstDay = new Date(y, m, 1);
  var lastDay  = new Date(y, m+1, 0);
  var startDow = firstDay.getDay(); // 0=Sun

  // dates with tasks
  var taskDates = {};
  TASKS.forEach(function(t){ if (t.due_date) taskDates[t.due_date] = true; });

  var html = DAYS_KR.map(function(d){ return '<div class="mini-cal-dow">'+d+'</div>'; }).join('');

  // leading blanks (prev month days)
  var prevLast = new Date(y, m, 0);
  for (var i = startDow - 1; i >= 0; i--) {
    var d = new Date(y, m-1, prevLast.getDate()-i);
    html += '<div class="mini-cal-day mcd-other" onclick="miniCalJump(\''+dateStr(d)+'\')">'+d.getDate()+'</div>';
  }

  for (var day = 1; day <= lastDay.getDate(); day++) {
    var d = new Date(y, m, day);
    var ds = dateStr(d);
    var cls = 'mini-cal-day';
    if (isSameDay(d, today)) cls += ' mcd-today';
    else if (isSameDay(d, pivotDate)) cls += ' mcd-selected';
    if (taskDates[ds]) cls += ' mcd-has-task';
    html += '<div class="'+cls+'" onclick="miniCalJump(\''+ds+'\')">'+day+'</div>';
  }

  // trailing
  var total = startDow + lastDay.getDate();
  var trailing = (7 - (total % 7)) % 7;
  for (var i = 1; i <= trailing; i++) {
    var d = new Date(y, m+1, i);
    html += '<div class="mini-cal-day mcd-other" onclick="miniCalJump(\''+dateStr(d)+'\')">'+i+'</div>';
  }

  document.getElementById('mini-cal-grid').innerHTML = html;
}

function miniCalNav(delta) {
  miniCalDate = new Date(miniCalDate.getFullYear(), miniCalDate.getMonth() + delta, 1);
  renderMiniCal();
}

function miniCalJump(ds) {
  pivotDate = parseDate(ds);
  miniCalDate = new Date(pivotDate.getFullYear(), pivotDate.getMonth(), 1);
  renderMiniCal();
  renderCalendar();
}

// ── View navigation ──
function setView(view, btn) {
  currentView = view;
  document.querySelectorAll('.view-tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderCalendar();
}

function navigate(delta) {
  if (currentView === 'week')  pivotDate = addDays(pivotDate, delta * 7);
  else if (currentView === 'month') pivotDate = new Date(pivotDate.getFullYear(), pivotDate.getMonth() + delta, 1);
  else pivotDate = addDays(pivotDate, delta);
  miniCalDate = new Date(pivotDate.getFullYear(), pivotDate.getMonth(), 1);
  renderMiniCal();
  renderCalendar();
}

function goToToday() {
  pivotDate = new Date();
  miniCalDate = new Date(pivotDate.getFullYear(), pivotDate.getMonth(), 1);
  renderMiniCal();
  renderCalendar();
}

// ── Calendar Renderers ──
var HOURS = ['오전 1','오전 2','오전 3','오전 4','오전 5','오전 6','오전 7','오전 8','오전 9','오전 10','오전 11','정오','오후 1','오후 2','오후 3','오후 4','오후 5','오후 6','오후 7','오후 8','오후 9','오후 10','오후 11'];

function renderCalendar() {
  var body = document.getElementById('ncal-body');
  if (currentView === 'week')  renderWeek(body);
  else if (currentView === 'month') renderMonth(body);
  else renderDay(body);
}

function renderWeek(body) {
  var monday = startOfWeek(pivotDate);
  var days = [];
  for (var i = 0; i < 7; i++) days.push(addDays(monday, i));

  // Range label
  var start = days[0], end = days[6];
  var lbl = '';
  if (start.getMonth() === end.getMonth())
    lbl = start.getFullYear()+'년 '+MONTHS_KR[start.getMonth()]+' '+start.getDate()+'–'+end.getDate()+'일';
  else
    lbl = MONTHS_KR[start.getMonth()]+' '+start.getDate()+' – '+MONTHS_KR[end.getMonth()]+' '+end.getDate()+', '+end.getFullYear();
  document.getElementById('range-label').textContent = lbl;

  var today = new Date();
  var cols = '48px '+days.map(function(){ return '1fr'; }).join(' ');

  // Day header
  var hdrHtml = '<div class="cal-week-day-header" style="grid-template-columns:'+cols+'">';
  hdrHtml += '<div style="border-bottom:none"></div>';
  days.forEach(function(d){
    var isT = isSameDay(d, today);
    hdrHtml += '<div class="cal-day-hdr-cell">';
    hdrHtml += '<div class="cal-day-name">'+DAYS_KR[d.getDay()]+'</div>';
    hdrHtml += '<div class="cal-day-num'+(isT?' is-today':'')+'">'+d.getDate()+'</div>';
    hdrHtml += '</div>';
  });
  hdrHtml += '</div>';

  // All-day row
  var adHtml = '<div class="cal-allday-row" style="grid-template-columns:'+cols+'">';
  adHtml += '<div class="cal-allday-gutter">종일</div>';
  days.forEach(function(d){
    var tasks = tasksForDate(d);
    adHtml += '<div class="cal-allday-cell" onclick="openNew(\''+dateStr(d)+'\')">';
    tasks.slice(0,3).forEach(function(t){
      var cc = chipClass(t);
      adHtml += '<div class="ev-chip '+cc+'" onclick="event.stopPropagation();showPopup(event,'+JSON.stringify(t).replace(/"/g,'&quot;')+')" title="'+escHtml(t.title)+'">'+escHtml(t.title)+'</div>';
    });
    if (tasks.length > 3) adHtml += '<div class="cal-month-more">+' + (tasks.length-3) + ' more</div>';
    adHtml += '</div>';
  });
  adHtml += '</div>';

  // Time grid
  var tgHtml = '<div class="cal-time-scroll"><div class="cal-time-grid" style="grid-template-columns:'+cols+'">';
  HOURS.forEach(function(h, idx){
    tgHtml += '<div class="cal-time-label">'+h+'</div>';
    days.forEach(function(d){
      tgHtml += '<div class="cal-time-cell" onclick="openNew(\''+dateStr(d)+'\')"></div>';
    });
  });
  tgHtml += '</div></div>';

  body.innerHTML = '<div class="cal-week-container">'+hdrHtml+adHtml+tgHtml+'</div>';
  addNowLine(body, days, cols);
}

function addNowLine(body, days, cols) {
  var now = new Date();
  var nowDs = dateStr(now);
  var dayIndex = -1;
  days.forEach(function(d, i){ if (dateStr(d) === nowDs) dayIndex = i; });
  if (dayIndex < 0) return;

  var scroll = body.querySelector('.cal-time-scroll');
  if (!scroll) return;

  // Calculate position: hour 0 = top, each hour = 44px, offset col
  var totalMins = now.getHours() * 60 + now.getMinutes();
  var top = (totalMins / 60) * 44;

  // Find the correct time cell column to overlay
  var grid = scroll.querySelector('.cal-time-grid');
  if (!grid) return;

  var colWidth = grid.offsetWidth / (days.length + 1); // +1 for gutter
  var leftPx = 48 + dayIndex * ((grid.offsetWidth - 48) / days.length);
  var colW = (grid.offsetWidth - 48) / days.length;

  var line = document.createElement('div');
  line.style.cssText = 'position:absolute;top:'+top+'px;left:'+leftPx+'px;width:'+colW+'px;height:2px;background:#ef4444;z-index:10;pointer-events:none;';
  var dot = document.createElement('div');
  dot.style.cssText = 'position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:#ef4444;';
  line.appendChild(dot);
  scroll.style.position = 'relative';
  scroll.appendChild(line);

  // Scroll to now
  scroll.scrollTop = Math.max(0, top - 100);
}

function renderMonth(body) {
  var y = pivotDate.getFullYear();
  var m = pivotDate.getMonth();
  document.getElementById('range-label').textContent = y+'년 '+MONTHS_KR[m];

  var today = new Date();
  var firstDay = new Date(y, m, 1);
  var lastDay  = new Date(y, m+1, 0);
  var startDow = firstDay.getDay();

  var html = '<div class="cal-month-container">';
  html += '<div class="cal-month-dow-row">';
  DAYS_KR.forEach(function(d){ html += '<div class="cal-month-dow">'+d+'</div>'; });
  html += '</div><div class="cal-month-grid">';

  // Leading prev month days
  var prevLast = new Date(y, m, 0);
  for (var i = startDow - 1; i >= 0; i--) {
    var d = new Date(y, m-1, prevLast.getDate()-i);
    html += '<div class="cal-month-cell other-m" onclick="miniCalJump(\''+dateStr(d)+'\')">';
    html += '<div class="cal-month-day-num">'+d.getDate()+'</div></div>';
  }

  for (var day = 1; day <= lastDay.getDate(); day++) {
    var d = new Date(y, m, day);
    var isT = isSameDay(d, today);
    var tasks = tasksForDate(d);
    html += '<div class="cal-month-cell'+(isT?' is-today':'')+'" onclick="openNew(\''+dateStr(d)+'\')">';
    html += '<div class="cal-month-day-num">'+day+'</div>';
    tasks.slice(0,3).forEach(function(t){
      var cc = chipClass(t);
      html += '<div class="ev-chip '+cc+'" onclick="event.stopPropagation();showPopup(event,'+JSON.stringify(t).replace(/"/g,'&quot;')+')" title="'+escHtml(t.title)+'">'+escHtml(t.title)+'</div>';
    });
    if (tasks.length > 3) html += '<div class="cal-month-more">+' + (tasks.length-3) + ' more</div>';
    html += '</div>';
  }

  var total = startDow + lastDay.getDate();
  var trailing = (7 - (total % 7)) % 7;
  for (var i = 1; i <= trailing; i++) {
    var d = new Date(y, m+1, i);
    html += '<div class="cal-month-cell other-m" onclick="miniCalJump(\''+dateStr(d)+'\')">';
    html += '<div class="cal-month-day-num">'+i+'</div></div>';
  }

  html += '</div></div>';
  body.innerHTML = html;
}

function renderDay(body) {
  var today = new Date();
  var isT = isSameDay(pivotDate, today);
  var dayName = DAYS_KR[pivotDate.getDay()]+'요일';
  var monthName = MONTHS_KR[pivotDate.getMonth()];
  document.getElementById('range-label').textContent = pivotDate.getFullYear()+'년 '+monthName+' '+pivotDate.getDate()+'일';

  var tasks = tasksForDate(pivotDate);

  var html = '<div class="cal-day-container">';
  html += '<div class="cal-day-hdr-single">';
  html += '<div class="cal-day-name">'+dayName+'</div>';
  html += '<div class="cal-day-num'+(isT?' is-today':'')+'">'+pivotDate.getDate()+'</div>';
  if (tasks.length > 0) {
    html += '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;">';
    tasks.forEach(function(t){
      var cc = chipClass(t);
      html += '<div class="ev-chip '+cc+'" style="font-size:.76rem;padding:3px 10px;" onclick="showPopup(event,'+JSON.stringify(t).replace(/"/g,'&quot;')+')" title="'+escHtml(t.title)+'">'+escHtml(t.title)+'</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="cal-time-scroll" style="flex:1;overflow-y:auto;"><div class="cal-time-grid" style="grid-template-columns:48px 1fr">';
  HOURS.forEach(function(h){
    html += '<div class="cal-time-label">'+h+'</div>';
    html += '<div class="cal-time-cell" onclick="openNew(\''+dateStr(pivotDate)+'\')"></div>';
  });
  html += '</div></div></div>';
  body.innerHTML = html;

  // Now line for day view
  if (isT) {
    var scroll = body.querySelector('.cal-time-scroll');
    var now = new Date();
    var top = ((now.getHours() * 60 + now.getMinutes()) / 60) * 44;
    var line = document.createElement('div');
    line.style.cssText = 'position:absolute;top:'+top+'px;left:48px;right:0;height:2px;background:#ef4444;z-index:10;pointer-events:none;';
    var dot = document.createElement('div');
    dot.style.cssText = 'position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:#ef4444;';
    line.appendChild(dot);
    scroll.style.position = 'relative';
    scroll.appendChild(line);
    scroll.scrollTop = Math.max(0, top - 100);
  }
}

// ── Popup ──
var popupTask = null;
function showPopup(evt, task) {
  evt.stopPropagation();
  popupTask = task;
  var popup = document.getElementById('task-popup');
  document.getElementById('tp-title').textContent = task.title;

  var statusMap = { todo:'할 일', doing:'진행 중', done:'완료' };
  var priMap    = { high:'🔴 긴급', normal:'🟡 보통', low:'🟢 낮음' };

  var rows = '';
  rows += '<div class="tp-row"><span class="tp-icon">📅</span>'+(task.due_date||'마감일 없음')+'</div>';
  rows += '<div class="tp-row"><span class="tp-icon">⚡</span>'+(priMap[task.priority]||'보통')+'</div>';
  rows += '<div class="tp-row"><span class="tp-icon">◎</span>'+statusMap[task.status]+'</div>';
  if (task.project_name) rows += '<div class="tp-row"><span class="tp-icon">📁</span>'+escHtml(task.project_name)+'</div>';
  if (task.assigned_to)  rows += '<div class="tp-row"><span class="tp-icon">👤</span>'+escHtml(task.assigned_to.split('@')[0])+'</div>';
  if (task.description)  rows += '<div class="tp-row" style="align-items:flex-start"><span class="tp-icon">📝</span><span style="white-space:pre-wrap;font-size:.72rem;line-height:1.4">'+escHtml(task.description.substring(0,120))+'</span></div>';
  document.getElementById('tp-rows').innerHTML = rows;

  document.getElementById('tp-actions').innerHTML =
    '<button class="tp-btn primary" onclick="closePopup();openEdit(JSON.parse(this.dataset.t))" data-t="'+JSON.stringify(task).replace(/"/g,'&quot;')+'">편집</button>'+
    '<form style="flex:1" method="POST" action="/portal/tasks/'+task.id+'/delete" onsubmit="return confirm(\'삭제할까요?\')">' +
    '<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">' +
    '<button type="submit" class="tp-btn danger" style="width:100%">삭제</button></form>';

  // Position popup near click
  var x = evt.clientX, y = evt.clientY;
  var pw = 292, ph = 260;
  if (x + pw > window.innerWidth - 10) x = x - pw - 10;
  if (y + ph > window.innerHeight - 10) y = window.innerHeight - ph - 10;
  popup.style.left = x + 'px';
  popup.style.top  = y + 'px';
  popup.classList.add('open');
}
function closePopup() { document.getElementById('task-popup').classList.remove('open'); }

// ── Modals ──
function openNew(dateStr) {
  closePopup();
  if (dateStr && typeof dateStr === 'string') {
    document.getElementById('new-due-date').value = dateStr;
  }
  document.getElementById('new-modal').classList.add('open');
}

function openEdit(task) {
  closePopup();
  document.getElementById('edit-form').action   = '/portal/tasks/'+task.id+'/edit';
  document.getElementById('del-form').action     = '/portal/tasks/'+task.id+'/delete';
  document.getElementById('edit-title').value    = task.title || '';
  document.getElementById('edit-desc').value     = task.description || '';
  document.getElementById('edit-due').value      = task.due_date || '';
  document.getElementById('edit-priority').value = task.priority || 'normal';
  document.getElementById('edit-status').value   = task.status || 'todo';
  setSelectVal('edit-project',  task.project_id  || '');
  setSelectVal('edit-assignee', task.assigned_to || '');
  document.getElementById('edit-modal').classList.add('open');
}

function setSelectVal(id, val) {
  var sel = document.getElementById(id);
  for (var i=0; i<sel.options.length; i++) {
    if (sel.options[i].value === String(val)) { sel.selectedIndex = i; return; }
  }
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──
document.addEventListener('DOMContentLoaded', function() {
  buildProjLabels();
  buildSidebarTasks();
  renderMiniCal();
  renderCalendar();

  // Close popup on outside click
  document.addEventListener('click', function(e){
    var popup = document.getElementById('task-popup');
    if (popup.classList.contains('open') && !popup.contains(e.target)) closePopup();
  });

  // Esc closes modals + popup
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') {
      closePopup();
      document.querySelectorAll('.modal-overlay').forEach(function(m){ m.classList.remove('open'); });
    }
  });
});
</script>
{% endblock %}
