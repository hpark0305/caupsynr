{% extends "base.html" %}
{% block title %}비밀번호 재설정 · Trauma Stress Lab{% endblock %}

{% block content %}
<section style="min-height:calc(100vh - var(--nav-h));display:flex;align-items:center;background:var(--bg);">
  <div class="container-sm" style="text-align:center;padding:60px 28px;">
    <div style="width:64px;height:64px;background:var(--accent-light);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;color:var(--violet-soft);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2m-4 0 3 3m-6 1 2.5 2.5"/></svg>
    </div>
    <span class="label" style="display:block;margin-bottom:12px;">Password Reset</span>
    <h1 style="font-size:2rem;margin-bottom:8px;">비밀번호 재설정</h1>
    <p style="color:var(--muted);max-width:380px;margin:0 auto 36px;font-size:.95rem;">온라인 비밀번호 재설정은 보안을 위해 중단되었습니다. 본인 확인과 계정 복구는 연구실 관리자에게 요청해주세요.</p>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px;max-width:400px;margin:0 auto;text-align:left;">
      <p style="text-align:center;margin-top:16px;font-size:.82rem;"><a href="{{ url_for('login') }}" style="color:var(--accent);">← 로그인으로 돌아가기</a></p>
    </div>
  </div>
</section>
{% endblock %}
